# Local infrastructure for Sisa-Saji (alternative to `npm run db:local`).
#   docker compose up -d
#   DATABASE_URL=postgres://sisasaji:sisasaji@127.0.0.1:5432/sisasaji
services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sisasaji
      POSTGRES_PASSWORD: sisasaji
      POSTGRES_DB: sisasaji
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:5432:5432" # localhost only — dev credentials are public
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisasaji -d sisasaji"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379" # localhost only — no Redis password in dev
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
